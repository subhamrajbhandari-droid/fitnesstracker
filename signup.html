<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack // SIGNUP</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-glow"></div>
<div class="glass-card">
    <div class="logo-box">
        <i class='bx bx-bolt-circle'></i>
    </div>
    <h2>FitTrack</h2>
    <p class="subtitle">INITIALIZE_NEW_IDENTITY</p>
        <form id="signup-form">
            <div class="input-group">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" placeholder="EMAIL_ADDRESS" required>
            </div>
            
            <div class="input-group">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="password" placeholder="ACCESS_CODE" required>
            </div>

            <button type="submit" id="signup-btn">
                <span>CREATE_ACCOUNT</span>
                <i class='bx bx-right-arrow-alt'></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>ALREADY_REGISTERED? <a href="login.html">LOGIN_HERE</a></p>
        </div>
    </div>

    <script type="module" src="signup.js"></script>
</body>
</html>
