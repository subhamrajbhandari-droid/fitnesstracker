<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack | Edit Profile</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="main-wrapper">
    <aside class="sidebar">
        <div class="logo-box"><i class='bx bx-bolt-circle'></i></div>
        <nav class="nav-links">
            <a href="dashboard.html"><i class='bx bx-grid-alt'></i></a>
            <a href="dashboard.html"><i class='bx bx-book-content'></i></a>
            <a href="profile.html" class="active"><i class='bx bx-user-circle'></i></a>
            <a href="#" id="logout-btn"><i class='bx bx-log-out'></i></a>
        </nav>
    </aside>

    <main class="content-area">
        <header class="main-header">
            <div>
                <p class="greeting">User Identity</p>
                <h1 class="welcome-text">Account Settings 👤</h1>
            </div>
            <a href="dashboard.html" style="text-decoration: none; color: var(--purple); font-weight: bold; display: flex; align-items: center; gap: 5px;">
                <i class='bx bx-left-arrow-alt'></i> Return to Dashboard
            </a>
        </header>

        <section class="dashboard-details">
            <div class="card logging-section">
                <div class="card-header"><h2>BIOMETRIC_DATA</h2></div>
                <form id="profile-edit-form">
                    <label style="font-size: 0.8rem; color: var(--dim);">Display Name</label>
                    <input type="text" id="display-name" placeholder="Enter your name" required>
                    
                    <label style="font-size: 0.8rem; color: var(--dim); margin-top: 15px; display: block;">Email (Read Only)</label>
                    <input type="email" id="user-email" disabled style="background: #f0f0f0; cursor: not-allowed; opacity: 0.6;">

                    <div class="input-row" style="margin-top: 15px;">
                        <div>
                            <label style="font-size: 0.8rem; color: var(--dim);">Weight (kg)</label>
                            <input type="number" id="user-weight" placeholder="70" step="0.1">
                        </div>
                        <div>
                            <label style="font-size: 0.8rem; color: var(--dim);">Height (cm)</label>
                            <input type="number" id="user-height" placeholder="175">
                        </div>
                    </div>

                    <button type="submit" id="save-btn" style="margin-top: 25px; width: 100%; padding: 15px; background: var(--purple); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">
                        SYNC_CHANGES_TO_CLOUD
                    </button>
                </form>
            </div>

            <div class="card chart-section">
                <div class="card-header"><h2>LIVE_PREVIEW</h2></div>
                <div style="text-align: center; padding: 20px;">
                    <div class="avatar-icon" style="font-size: 5rem; color: var(--purple);">
                        <i class='bx bxs-user-circle'></i>
                    </div>
                    <h2 id="preview-name" style="margin: 10px 0 5px 0;">---</h2>
                    <p id="preview-email" style="color: var(--dim); font-size: 0.9rem;">---</p>
                </div>
                
                <div class="vital-stats" style="margin-top: 10px; background: #f8faff; border: 1px solid #eee;">
                    <div><strong>Status</strong><p style="color: var(--teal);">VERIFIED</p></div>
                    <div><strong>Access</strong><p>LEVEL_01</p></div>
                </div>
            </div>
        </section>

        <section class="card history-card" style="margin-top: 20px;">
            <div class="card-header"><h2>SYSTEM_METADATA</h2></div>
            <div class="log-item">
                <span>Account ID</span>
                <span id="user-id" style="font-family: monospace; color: var(--dim);">Fetching...</span>
            </div>
            <div class="log-item">
                <span>Registration Date</span>
                <span id="user-joined" style="font-weight: bold; color: var(--text);">RECENT</span>
            </div>
        </section>
    </main>

    <aside class="profile-panel">
        <div class="user-info">
            <div class="avatar-icon"><i class='bx bxs-user-circle bx-lg' style="color: var(--purple);"></i></div>
            <div>
                <h3 id="user-display">---</h3>
                <p style="font-size: 0.75rem; color: var(--teal);">ACTIVE_SESSION</p>
            </div>
        </div>
        <div class="vital-stats" style="background: var(--bg);">
            <div><strong>Cloud</strong><p>Synced</p></div>
            <div><strong>v2.1.0</strong><p>Build</p></div>
        </div>
    </aside>
</div>

<script type="module" src="profile.js"></script>

</body>
</html>
