<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="bg-glow"></div>

    <div class="glass-card">
        <div class="logo-box">
            <i class='bx bx-bolt-circle'></i>
        </div>
        <h1>FitTrack</h1>
        <p class="subtitle">SYSTEM_ACCESS_REQUIRED</p>

        <form id="login-form">
            <div class="input-group">
                <i class='bx bx-envelope'></i>
                <input type="email" id="email" placeholder="EMAIL_ADDRESS" required>
            </div>
            
            <div class="input-group">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="password" placeholder="ACCESS_CODE" required>
            </div>

            <button type="submit" id="login-btn">
                <span>LOGIN_SYSTEM</span>
                <i class='bx bx-log-in-circle'></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>NEW_IDENTITY? <a href="signup.html">CREATE_ACCOUNT</a></p>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
